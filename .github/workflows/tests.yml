name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          # Not the default requirements.txt / pyproject.toml, so name it
          # explicitly or setup-python fails before installing anything.
          cache-dependency-path: "requirements-test.txt"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest
